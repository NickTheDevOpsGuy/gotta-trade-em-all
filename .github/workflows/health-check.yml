# Optional: Run after deploy to verify /api/health
# Trigger manually with a deploy URL, or set DEPLOY_URL secret
name: Health Check

on:
  workflow_dispatch:
    inputs:
      url:
        description: 'Deploy URL (e.g. https://xxx.vercel.app)'
        required: true

jobs:
  health:
    runs-on: ubuntu-latest
    steps:
      - name: Check health endpoint
        run: |
          URL="${{ github.event.inputs.url }}"
          curl -sf "${URL%/}/api/health" || exit 1
